<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project</title>
    <link rel="icon" type="image/x-icon" href="appul.png">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1 id="main-title">Welcome to the Mini Project</h1>
    </header>

    <main>
    <form>
        <label for="username">Name:</label>
        <input type="text" id="username" placeholder="Mike" required> <br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="mike@example.com" required> <br>

        <label for="age">Age:</label>
        <input type="date" id="age" placeholder="30" required> <br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required> <br>

        <input type="reset"> <br>
        <input type="submit">

    </form>
    </main>
    
</body>
</html>
