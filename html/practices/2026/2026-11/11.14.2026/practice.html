<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/x-icon" href="appul.png">
    </head>
    <body>
        <h1>Store Hours</h1>

<table border="1" style="background-color: black"> <!-- Required to make a table. For border, larger the number, the thicker it is -->
    <tr align="center"  style="background-color: lightblue;"> <!-- Aligns the text in the center of the table. You can do "right" too to put the data at the rightmost place. Same for left, but its automatically set to the left anyway. -->
        <th width="100"  style="background-color: lightgreen">Sunday</th> <!-- TH stands for Table Headers. You can style each individually -->
        <th width="100">Monday</th>
        <th width="100">Tuesday</th><!-- Width means how much space the characters have, reducing letter cramming -->
        <th width="100">Wednesday</th>
        <th width="100">Thursday</th>
        <th width="100">Friday</th>
        <th width="100">Saturday</th>
    </tr> <!-- TR stands for Table Row-->
    <tr align="center"> <!-- Aligns the text in the center of the table. You can do "right" too to put the data at the rightmost place. Same for left, but its automatically set to the left anyway. -->
        <td>Closed</td> <!-- TD stands for Table Data -->
        <td>9-5</td>
        <td>9-5</td>
        <td>9-5</td>
        <td>9-5</td>
        <td>9-5</td>
        <td>10-2</td>
    </tr>
</table>
    </body>
</html>
